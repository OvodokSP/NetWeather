name: Улучшение
description: Предложить новую возможность или UX-изменение
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую проблему решаем
      description: Сначала пользовательская проблема, затем решение.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Желаемое поведение
      description: Что пользователь должен увидеть/сделать.
    validations:
      required: true
  - type: dropdown
    id: capability
    attributes:
      label: Область
      options:
        - Overview / UI
        - Resources / Groups
        - Global Probe
        - Domestic Probe
        - Browser Probe
        - Native Probe
        - Fault Domain
        - Alerts / Reports
        - Security / Deployment
        - Other
  - type: textarea
    id: done
    attributes:
      label: Критерии готовности
      description: Проверяемые условия.
