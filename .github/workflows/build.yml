name: Build NetWeather APK

on:
  push:
    branches: [ main, develop, "feature/**", "fix/**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then gradle wrapper --gradle-version 8.7 --no-daemon; fi
          chmod +x ./gradlew
      - name: Test
        run: ./gradlew test --no-daemon --stacktrace
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NetWeather-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Publish Android release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NetWeather-debug
          path: release
      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          apk="$(find release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          mv "$apk" release/NetWeather-${GITHUB_SHA::12}-debug.apk
          (cd release && sha256sum *.apk > NetWeather-${GITHUB_SHA::12}-debug.apk.sha256)
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.ref_name }}-${{ github.run_number }}
          name: NetWeather Android ${{ github.ref_name }} build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: release/*
