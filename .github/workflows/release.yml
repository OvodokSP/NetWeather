name: Publish Android preview

on:
  workflow_dispatch:
  push:
    tags: [ "android-v*" ]
    branches: [ feature/web-vps-monitoring ]
    paths:
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then gradle wrapper --gradle-version 8.7 --no-daemon; fi
          chmod +x ./gradlew
      - name: Test and build installable preview APK
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Prepare versioned APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          install -m 0644 \
            app/build/outputs/apk/debug/app-debug.apk \
            NetWeather-0.4.0-alpha-debug.apk
          sha256sum NetWeather-0.4.0-alpha-debug.apk > NetWeather-0.4.0-alpha-debug.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: NetWeather-0.4.0-alpha-debug
          path: |
            NetWeather-0.4.0-alpha-debug.apk
            NetWeather-0.4.0-alpha-debug.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_TAG: android-v0.4.0-alpha-preview.1
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$PREVIEW_TAG" >/dev/null 2>&1; then
            gh release upload "$PREVIEW_TAG" \
              NetWeather-0.4.0-alpha-debug.apk \
              NetWeather-0.4.0-alpha-debug.apk.sha256 \
              --clobber
            gh release edit "$PREVIEW_TAG" \
              --title "NetWeather Android 0.4.0 alpha preview 1" \
              --notes-file docs/ANDROID_PREVIEW.md \
              --prerelease
          else
            gh release create "$PREVIEW_TAG" \
              NetWeather-0.4.0-alpha-debug.apk \
              NetWeather-0.4.0-alpha-debug.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "NetWeather Android 0.4.0 alpha preview 1" \
              --notes-file docs/ANDROID_PREVIEW.md \
              --prerelease
          fi
