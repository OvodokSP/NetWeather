services:
  netweather:
    build: .
    restart: unless-stopped
    environment:
      NETWEATHER_API_TOKEN: ${NETWEATHER_API_TOKEN}
      DEFAULT_INTERVAL_SECONDS: ${DEFAULT_INTERVAL_SECONDS:-60}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-8}
      ALLOW_PRIVATE_TARGETS: ${ALLOW_PRIVATE_TARGETS:-false}
    volumes:
      - netweather_data:/data
    ports:
      - "127.0.0.1:${NETWEATHER_BIND_PORT:-18081}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  netweather_data:
